<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Vendas - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Sistema de Vendas</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link" href="produtos.html">Produtos</a>
                <a class="nav-link" href="vendas.html">Nova Venda</a>
                <a class="nav-link active" href="consulta_vendas.html">Consultar Vendas</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between">
                <h4><i class="bi bi-search"></i> Histórico de Vendas</h4>
                <button class="btn btn-light btn-sm" onclick="carregarVendas()">
                    <i class="bi bi-arrow-clockwise"></i> Atualizar
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="tabelaVendas">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Data</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Itens</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function carregarVendas() {
            const res = await fetch('/api/vendas');
            const vendas = await res.json();
            const tbody = document.querySelector('#tabelaVendas tbody');
            tbody.innerHTML = '';

            vendas.forEach(v => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.id}</td>
                    <td>${new Date(v.data_venda).toLocaleDateString('pt-BR')}</td>
                    <td>${v.cliente_nome}</td>
                    <td class="fw-bold">R$ ${parseFloat(v.total).toFixed(2)}</td>
                    <td>${v.quantidade_itens} itens</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="verDetalhes(${v.id})">
                            <i class="bi bi-eye"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function verDetalhes(id) {
            const res = await fetch(`/api/vendas/${id}`);
            const venda = await res.json();
            
            let detalhes = `Venda #${venda.id}\n`;
            detalhes += `Cliente: ${venda.cliente_nome}\n`;
            detalhes += `Data: ${new Date(venda.data_venda).toLocaleDateString('pt-BR')}\n\nItens:\n`;
            
            venda.itens.forEach(item => {
                detalhes += `- ${item.nome} (x${item.quantidade}) - R$ ${item.subtotal.toFixed(2)}\n`;
            });
            
            detalhes += `\nTotal: R$ ${parseFloat(venda.total).toFixed(2)}`;
            alert(detalhes);
        }

        window.onload = carregarVendas;
    </script>
</body>
</html>
