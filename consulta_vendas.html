<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SportMax - Consulta de Vendas</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="clientes.html">Clientes</a>
    <a href="produtos.html">Produtos</a>
    <a href="vendas.html">Vendas</a>
    <a href="consulta_vendas.html">Consultar Vendas</a>
</nav>

<header class="banner">
    <h1>Histórico de Vendas</h1>
    <p>Consulta completa das vendas realizadas</p>
</header>

<div class="container">

<div class="card">

<h2>Vendas Registradas</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Data</th>
<th>Cliente</th>
<th>Total</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="lista-vendas">
</tbody>

</table>

</div>

<div class="card" id="detalhes" style="display:none;">

<h2>Detalhes da Venda</h2>

<table>

<thead>
<tr>
<th>Produto</th>
<th>Quantidade</th>
<th>Preço Unitário</th>
</tr>
</thead>

<tbody id="itens-venda">
</tbody>

</table>

</div>

</div>

<script>

fetch('/listar-vendas')

.then(res => res.json())

.then(vendas => {

const tabela =
document.getElementById('lista-vendas');

vendas.forEach(venda => {

tabela.innerHTML += `
<tr>
<td>${venda.id}</td>
<td>${venda.data}</td>
<td>${venda.nome_cliente}</td>
<td>R$ ${venda.total}</td>
<td>
<button onclick="verDetalhes(${venda.id})">
Ver
</button>
</td>
</tr>
`;

});

});

function verDetalhes(id){

fetch(`/detalhes-venda/${id}`)

.then(res => res.json())

.then(itens => {

document.getElementById('detalhes').style.display =
'block';

const tabela =
document.getElementById('itens-venda');

tabela.innerHTML = '';

itens.forEach(item => {

tabela.innerHTML += `
<tr>
<td>${item.nome}</td>
<td>${item.quantidade}</td>
<td>R$ ${item.preco_unitario}</td>
</tr>
`;

});

window.scrollTo({
top:
document.getElementById('detalhes').offsetTop,
behavior:'smooth'
});

});

}

</script>

<footer class="rodape">
<p>© 2026 SportMax</p>
</footer>

</body>
</html>
