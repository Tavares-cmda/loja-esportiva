<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - SPORT+ PRO 2.1</title>

<link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<button
id="btnTema"
class="dark-toggle">
🌙
</button>

<aside class="sidebar">

    <div class="logo">
        SPORT+
    </div>

    <nav class="menu">

        <a href="index.html">
            🏠 Home
        </a>

        <a href="clientes.html">
            👥 Clientes
        </a>

        <a href="produtos.html">
            📦 Produtos
        </a>

        <a href="vendas.html">
            🛒 Vendas
        </a>

        <a href="consultas.html">
            📊 Consultas
        </a>

    </nav>

    <button
    id="btnLogout"
    class="btn-danger menu-btn">
    🚪 Sair
    </button>

</aside>

<main class="main">

    <h1 class="titulo">
        Gestão de Clientes
    </h1>

    <!-- FORMULÁRIO -->

    <section class="card">

        <h2>
            ➕ Novo Cliente
        </h2>

        <br>

        <input
        type="hidden"
        id="clienteId">

        <input
        type="text"
        id="clienteNome"
        placeholder="Nome do Cliente">

        <input
        type="email"
        id="clienteEmail"
        placeholder="E-mail">

        <input
        type="text"
        id="clienteTelefone"
        placeholder="Telefone">

        <button
        id="btnSalvarCliente"
        class="btn-primary">
        💾 Salvar Cliente
        </button>

        <button
        id="btnCancelarCliente"
        class="btn-warning">
        ❌ Cancelar Edição
        </button>

    </section>

    <!-- PESQUISA -->

    <section class="card">

        <h2>
            🔍 Pesquisar Cliente
        </h2>

        <br>

        <input
        type="text"
        id="pesquisaCliente"
        placeholder="Digite o nome, email ou telefone">

    </section>

    <!-- TABELA -->

    <section class="card">

        <h2>
            👥 Clientes Cadastrados
        </h2>

        <br>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="tabelaClientes">

            </tbody>

        </table>

    </section>

    <!-- ESTATÍSTICAS -->

    <section class="cards">

        <div class="card-dashboard">

            <h3>
                Total de Clientes
            </h3>

            <div
            id="estatisticaClientes"
            class="valor">
            0
            </div>

        </div>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
