<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Sistema de Vendas</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link active" href="produtos.html">Produtos</a>
                <a class="nav-link" href="vendas.html">Nova Venda</a>
                <a class="nav-link" href="consulta_vendas.html">Consultar Vendas</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4><i class="bi bi-box-seam"></i> Cadastro de Produtos</h4>
            </div>
            <div class="card-body">
                <form id="formProduto">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Preço (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="preco" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Estoque</label>
                            <input type="number" class="form-control" id="estoque" value="10" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-4">
                        <i class="bi bi-save"></i> Salvar Produto
                    </button>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header bg-primary text-white">
                <h5>Produtos Cadastrados</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover" id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function carregarProdutos() {
            const res = await fetch('/api/produtos');
            const produtos = await res.json();
            const tbody = document.querySelector('#tabelaProdutos tbody');
            tbody.innerHTML = '';

            produtos.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.nome}</td>
                    <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
                    <td>${p.estoque}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deletarProduto(${p.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('formProduto').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const produto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                estoque: parseInt(document.getElementById('estoque').value)
            };

            const res = await fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            });

            if (res.ok) {
                alert("✅ Produto cadastrado com sucesso!");
                document.getElementById('formProduto').reset();
                carregarProdutos();
            } else {
                alert("Erro ao cadastrar produto");
            }
        });

        async function deletarProduto(id) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
                carregarProdutos();
            }
        }

        window.onload = carregarProdutos;
    </script>
</body>
</html>
