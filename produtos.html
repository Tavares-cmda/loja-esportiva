<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SportMax - Produtos</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="clientes.html">Clientes</a>
    <a href="produtos.html">Produtos</a>
    <a href="vendas.html">Vendas</a>
    <a href="consulta_vendas.html">Consultar Vendas</a>
</nav>

<header class="banner">
    <h1>Produtos Esportivos</h1>
    <p>Controle de Estoque</p>
</header>

<div class="container">

<div class="card">

<h2>Novo Produto</h2>

<form action="/salvar-produto" method="POST">

<label>Nome do Produto</label>
<input
type="text"
name="nome"
required>

<label>Categoria</label>

<select name="categoria">

<option>Futebol</option>
<option>Basquete</option>
<option>Corrida</option>
<option>Academia</option>
<option>Vôlei</option>

</select>

<label>Preço</label>

<input
type="number"
step="0.01"
name="preco"
required>

<label>Estoque</label>

<input
type="number"
name="estoque"
required>

<button type="submit">
Salvar Produto
</button>

</form>

</div>

<div class="card">

<h2>Produtos Cadastrados</h2>

<table>

<thead>
<tr>
<th>Produto</th>
<th>Categoria</th>
<th>Preço</th>
<th>Estoque</th>
</tr>
</thead>

<tbody id="lista-produtos">

</tbody>

</table>

</div>

</div>

<script>

fetch('/listar-produtos')
.then(res => res.json())
.then(produtos => {

const tabela =
document.getElementById('lista-produtos');

produtos.forEach(produto => {

tabela.innerHTML += `
<tr>
<td>${produto.nome}</td>
<td>${produto.categoria}</td>
<td>R$ ${produto.preco}</td>
<td>${produto.estoque}</td>
</tr>
`;

});

});

</script>

<footer class="rodape">
<p>© 2026 SportMax</p>
</footer>

</body>
</html>
