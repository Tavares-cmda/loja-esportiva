<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produtos - SPORT+ PRO 2.1</title>

<link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<button
id="btnTema"
class="dark-toggle">
🌙
</button>

<aside class="sidebar">

    <div class="logo">
        SPORT+
    </div>

    <nav class="menu">

        <a href="index.html">🏠 Home</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="produtos.html">📦 Produtos</a>
        <a href="vendas.html">🛒 Vendas</a>
        <a href="consultas.html">📊 Consultas</a>

    </nav>

    <button
    id="btnLogout"
    class="btn-danger menu-btn">
    🚪 Sair
    </button>

</aside>

<main class="main">

    <h1 class="titulo">
        Gestão de Produtos
    </h1>

    <!-- CADASTRO -->

    <section class="card">

        <h2>
            ➕ Novo Produto
        </h2>

        <br>

        <input
        type="hidden"
        id="produtoId">

        <input
        type="text"
        id="produtoNome"
        placeholder="Nome do Produto">

        <select id="produtoCategoria">

            <option value="">
                Selecione uma categoria
            </option>

            <option>Chuteira de Campo</option>
            <option>Chuteira Society</option>
            <option>Chuteira Futsal</option>
            <option>Bola Oficial</option>
            <option>Bola de Basquete</option>
            <option>Tênis de Corrida</option>
            <option>Camisa Dry Fit</option>
            <option>Luva de Academia</option>
            <option>Óculos de Natação</option>

        </select>

        <input
        type="number"
        step="0.01"
        id="produtoPreco"
        placeholder="Preço">

        <input
        type="number"
        id="produtoEstoque"
        placeholder="Quantidade em Estoque">

        <input
        type="text"
        id="produtoImagem"
        placeholder="URL da Imagem">

        <button
        id="btnSalvarProduto"
        class="btn-primary">
        💾 Salvar Produto
        </button>

        <button
        id="btnCancelarProduto"
        class="btn-warning">
        ❌ Cancelar Edição
        </button>

    </section>

    <!-- PESQUISA -->

    <section class="card">

        <h2>
            🔍 Pesquisar Produto
        </h2>

        <br>

        <input
        type="text"
        id="pesquisaProduto"
        placeholder="Digite o nome ou categoria">

    </section>

    <!-- ESTOQUE BAIXO -->

    <section class="card">

        <h2>
            ⚠️ Estoque Baixo
        </h2>

        <br>

        <table>

            <thead>

                <tr>
                    <th>Produto</th>
                    <th>Estoque</th>
                </tr>

            </thead>

            <tbody id="tabelaEstoqueBaixo">

            </tbody>

        </table>

    </section>

    <!-- PRODUTOS -->

    <section class="card">

        <h2>
            📦 Produtos Cadastrados
        </h2>

        <br>

        <table>

            <thead>

                <tr>

                    <th>Imagem</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="tabelaProdutos">

            </tbody>

        </table>

    </section>

    <!-- ESTATÍSTICAS -->

    <section class="cards">

        <div class="card-dashboard">

            <h3>
                Total de Produtos
            </h3>

            <div
            id="estatisticaProdutos"
            class="valor">
            0
            </div>

        </div>

        <div class="card-dashboard">

            <h3>
                Produtos com Estoque Baixo
            </h3>

            <div
            id="estatisticaEstoqueBaixo"
            class="valor">
            0
            </div>

        </div>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
