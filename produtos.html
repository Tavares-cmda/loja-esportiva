<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - SPORT+ PRO 2.0</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        body{
            background:#f4f6f9;
        }
        .sidebar{
            position:fixed;
            left:0;
            top:0;
            width:250px;
            height:100%;
            background:#111827;
            padding:20px;
        }
        .logo{
            color:white;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            margin-bottom:30px;
        }
        .menu a{
            display:block;
            color:white;
            text-decoration:none;
            padding:14px;
            margin-bottom:8px;
            border-radius:10px;
        }
        .menu a:hover{
            background:#2563eb;
        }
        .main{
            margin-left:250px;
            padding:30px;
        }
        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
        }
        input, select{
            width:100%;
            padding:12px;
            margin-bottom:10px;
            border:1px solid #ddd;
            border-radius:8px;
        }
        button{
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
            font-weight: bold;
        }
        .salvar{
            background:#2563eb;
            color:white;
        }
        .editar{
            background:#f59e0b;
            color:white;
        }
        .excluir{
            background:#dc2626;
            color:white;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        th,td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:left;
        }
        th{
            background:#2563eb;
            color:white;
        }
        .produto-img{
            width:60px;
            height:60px;
            object-fit:cover;
            border-radius:8px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">SPORT+</div>
    <div class="menu">
        <a href="index.html">🏠 Home</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="produtos.html">📦 Produtos</a>
        <a href="vendas.html">🛒 Vendas</a>
        <a href="consultas.html">📊 Consultas</a>
    </div>
</div>

<div class="main">
    <h1>Produtos</h1>

    <div class="card">
        <input type="hidden" id="id">
        <input type="text" id="nome" placeholder="Nome do produto" required>
        <select id="categoria">
            <option value="">Selecione a categoria</option>
            <option>Chuteira de Campo</option>
            <option>Chuteira Society</option>
            <option>Chuteira Futsal</option>
            <option>Bola Oficial</option>
            <option>Bola de Basquete</option>
            <option>Tênis de Corrida</option>
            <option>Camisa Dry Fit</option>
            <option>Luva de Academia</option>
            <option>Óculos de Natação</option>
        </select>
        <input type="number" step="0.01" id="preco" placeholder="Preço (R$)" required>
        <input type="number" id="estoque" placeholder="Quantidade em estoque" required>
        <input type="text" id="imagem" placeholder="URL da imagem (opcional)">
        <button class="salvar" onclick="salvarProduto()">Salvar Produto</button>
    </div>

    <div class="card">
        <input type="text" id="busca" placeholder="Pesquisar produto..." onkeyup="pesquisarProduto()">
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
        </table>
    </div>
</div>

<script>
// Proteção de autenticação
fetch("/session")
.then(r => r.json())
.then(user => {
    if (!user) location.href = "login.html";
});

let produtosData = []; // Guardar dados para pesquisa e edição

async function carregarProdutos() {
    try {
        const resposta = await fetch("/produtos");
        const produtos = await resposta.json();
        
        produtosData = produtos;
        renderizarTabela(produtos);
    } catch (error) {
        console.error("Erro ao carregar produtos:", error);
        alert("Erro ao carregar produtos.");
    }
}

function renderizarTabela(produtos) {
    let html = "";
    produtos.forEach(produto => {
        const imagemSrc = produto.imagem || 'https://via.placeholder.com/60';
        
        html += `
        <tr>
            <td><img src="${imagemSrc}" class="produto-img" alt="${produto.nome}"></td>
            <td>${produto.nome}</td>
            <td>${produto.categoria}</td>
            <td>R$ ${Number(produto.preco).toFixed(2)}</td>
            <td>${produto.estoque}</td>
            <td>
                <button class="editar" onclick="editarProduto(${produto.id})">Editar</button>
                <button class="excluir" onclick="excluirProduto(${produto.id})">Excluir</button>
            </td>
        </tr>`;
    });
    document.getElementById("tabelaProdutos").innerHTML = html;
}

async function salvarProduto() {
    const id = document.getElementById("id").value.trim();
    const dados = {
        nome: document.getElementById("nome").value.trim(),
        categoria: document.getElementById("categoria").value,
        preco: parseFloat(document.getElementById("preco").value),
        estoque: parseInt(document.getElementById("estoque").value),
        imagem: document.getElementById("imagem").value.trim()
    };

    if (!dados.nome || !dados.categoria || isNaN(dados.preco) || isNaN(dados.estoque)) {
        alert("Preencha todos os campos obrigatórios corretamente!");
        return;
    }

    try {
        if (id) {
            await fetch(`/produtos/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });
            alert("Produto atualizado com sucesso!");
        } else {
            await fetch("/produtos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });
            alert("Produto cadastrado com sucesso!");
        }

        limparFormulario();
        carregarProdutos();
    } catch (error) {
        console.error(error);
        alert("Erro ao salvar produto.");
    }
}

function editarProduto(id) {
    const produto = produtosData.find(p => p.id === id);
    if (!produto) return;

    document.getElementById("id").value = produto.id;
    document.getElementById("nome").value = produto.nome;
    document.getElementById("categoria").value = produto.categoria;
    document.getElementById("preco").value = produto.preco;
    document.getElementById("estoque").value = produto.estoque;
    document.getElementById("imagem").value = produto.imagem || "";
}

async function excluirProduto(id) {
    if (!confirm("Deseja realmente excluir este produto?")) return;

    try {
        await fetch(`/produtos/${id}`, { method: "DELETE" });
        alert("Produto excluído com sucesso!");
        carregarProdutos();
    } catch (error) {
        console.error(error);
        alert("Erro ao excluir produto.");
    }
}

function pesquisarProduto() {
    const texto = document.getElementById("busca").value.toLowerCase().trim();
    
    if (texto === "") {
        renderizarTabela(produtosData);
        return;
    }

    const filtrados = produtosData.filter(produto => 
        produto.nome.toLowerCase().includes(texto) ||
        produto.categoria.toLowerCase().includes(texto)
    );
    
    renderizarTabela(filtrados);
}

function limparFormulario() {
    document.getElementById("id").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("categoria").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("estoque").value = "";
    document.getElementById("imagem").value = "";
}

// Carregar ao iniciar
carregarProdutos();
</script>

</body>
</html>
