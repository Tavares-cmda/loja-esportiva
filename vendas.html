<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SportMax - Vendas</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="clientes.html">Clientes</a>
    <a href="produtos.html">Produtos</a>
    <a href="vendas.html">Vendas</a>
    <a href="consulta_vendas.html">Consultar Vendas</a>
</nav>

<header class="banner">
    <h1>Registrar Venda</h1>
    <p>Controle de vendas da loja</p>
</header>

<div class="container">

<div class="card">

<h2>Nova Venda</h2>

<label>Cliente</label>
<select id="cliente"></select>

<label>Produto</label>
<select id="produto"></select>

<label>Quantidade</label>
<input type="number" id="quantidade" value="1">

<button onclick="adicionarCarrinho()">
Adicionar ao Carrinho
</button>

</div>

<div class="card">

<h2>Carrinho</h2>

<table>

<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th>Preço</th>
</tr>
</thead>

<tbody id="carrinho">
</tbody>

</table>

<h3 id="total">
Total: R$ 0.00
</h3>

<button onclick="finalizarVenda()">
Finalizar Venda
</button>

</div>

</div>

<script>

let produtos = [];
let itensVenda = [];
let total = 0;

fetch('/listar-clientes')
.then(res => res.json())
.then(clientes => {

const select =
document.getElementById('cliente');

clientes.forEach(cliente => {

select.innerHTML += `
<option value="${cliente.id}">
${cliente.nome}
</option>
`;

});

});

fetch('/listar-produtos')
.then(res => res.json())
.then(lista => {

produtos = lista;

const select =
document.getElementById('produto');

lista.forEach(produto => {

select.innerHTML += `
<option value="${produto.id}">
${produto.nome} - R$ ${produto.preco}
</option>
`;

});

});

function adicionarCarrinho(){

const produtoId =
parseInt(document.getElementById('produto').value);

const qtd =
parseInt(document.getElementById('quantidade').value);

const produto =
produtos.find(p => p.id === produtoId);

const subtotal =
produto.preco * qtd;

total += subtotal;

itensVenda.push({
id: produto.id,
qtd: qtd,
preco: produto.preco
});

document.getElementById('carrinho').innerHTML += `
<tr>
<td>${produto.nome}</td>
<td>${qtd}</td>
<td>R$ ${subtotal.toFixed(2)}</td>
</tr>
`;

document.getElementById('total').innerHTML =
`Total: R$ ${total.toFixed(2)}`;

}

function finalizarVenda(){

fetch('/finalizar-venda',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

cliente_id:
document.getElementById('cliente').value,

total: total,

itens: itensVenda

})

})

.then(res => res.json())

.then(() => {

alert('Venda realizada com sucesso!');

location.reload();

});

}

</script>

<footer class="rodape">
<p>© 2026 SportMax</p>
</footer>

</body>
</html>
