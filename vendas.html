<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendas - SPORT+ PRO 2.1</title>

<link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<button
id="btnTema"
class="dark-toggle">
🌙
</button>

<aside class="sidebar">

    <div class="logo">
        SPORT+
    </div>

    <nav class="menu">

        <a href="index.html">🏠 Home</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="produtos.html">📦 Produtos</a>
        <a href="vendas.html">🛒 Vendas</a>
        <a href="consultas.html">📊 Consultas</a>

    </nav>

    <button
    id="btnLogout"
    class="btn-danger menu-btn">
    🚪 Sair
    </button>

</aside>

<main class="main">

    <h1 class="titulo">
        Nova Venda
    </h1>

    <!-- SELEÇÃO -->

    <section class="card">

        <h2>
            🛒 Registrar Venda
        </h2>

        <br>

        <select id="vendaCliente">
            <option value="">
                Selecione um cliente
            </option>
        </select>

        <select id="vendaProduto">
            <option value="">
                Selecione um produto
            </option>
        </select>

        <input
        type="number"
        id="vendaQuantidade"
        min="1"
        value="1"
        placeholder="Quantidade">

        <button
        id="btnAdicionarCarrinho"
        class="btn-primary">
        ➕ Adicionar ao Carrinho
        </button>

    </section>

    <!-- CARRINHO -->

    <section class="card">

        <h2>
            🧾 Carrinho
        </h2>

        <br>

        <table>

            <thead>

                <tr>

                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Qtd</th>
                    <th>Subtotal</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="tabelaCarrinho">

            </tbody>

        </table>

        <br>

        <h2 id="totalCarrinho">
            Total: R$ 0,00
        </h2>

        <br>

        <button
        id="btnFinalizarVenda"
        class="btn-success">
        ✅ Finalizar Venda
        </button>

        <button
        id="btnLimparCarrinho"
        class="btn-danger">
        🗑️ Limpar Carrinho
        </button>

    </section>

    <!-- RESUMO -->

    <section class="cards">

        <div class="card-dashboard">

            <h3>
                Itens no Carrinho
            </h3>

            <div
            id="estatisticaItensCarrinho"
            class="valor">
            0
            </div>

        </div>

        <div class="card-dashboard">

            <h3>
                Valor Total
            </h3>

            <div
            id="estatisticaValorCarrinho"
            class="valor">
            R$ 0,00
            </div>

        </div>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
