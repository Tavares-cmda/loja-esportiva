<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Sistema de Vendas</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link" href="produtos.html">Produtos</a>
                <a class="nav-link active" href="vendas.html">Nova Venda</a>
                <a class="nav-link" href="consulta_vendas.html">Consultar Vendas</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4><i class="bi bi-cart-check"></i> Nova Venda</h4>
            </div>
            <div class="card-body">
                <form id="formVenda">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Cliente</label>
                            <select class="form-select" id="cliente_id" required>
                                <option value="">Selecione um cliente...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" id="data_venda" value="" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h5>Itens da Venda</h5>
                        <div class="row mb-3">
                            <div class="col-md-5">
                                <select class="form-select" id="produto_id">
                                    <option value="">Selecione um produto...</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" id="quantidade" placeholder="Qtd" min="1" value="1">
                            </div>
                            <div class="col-md-3">
                                <button type="button" class="btn btn-success w-100" onclick="adicionarItem()">
                                    <i class="bi bi-plus-circle"></i> Adicionar
                                </button>
                            </div>
                        </div>

                        <table class="table table-hover" id="tabelaItens">
                            <thead class="table-light">
                                <tr>
                                    <th>Produto</th>
                                    <th>Preço Unit.</th>
                                    <th>Qtd</th>
                                    <th>Subtotal</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <div class="row mt-4">
                        <div class="col-md-6">
                            <h5>Total: <span id="totalVenda" class="text-success fw-bold">R$ 0,00</span></h5>
                        </div>
                        <div class="col-md-6 text-end">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-lg"></i> Finalizar Venda
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let itensVenda = [];

        async function carregarClientes() {
            const res = await fetch('/api/clientes');
            const clientes = await res.json();
            const select = document.getElementById('cliente_id');
            clientes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${c.nome} - ${c.cpf || c.email}`;
                select.appendChild(opt);
            });
        }

        async function carregarProdutos() {
            const res = await fetch('/api/produtos');
            const produtos = await res.json();
            const select = document.getElementById('produto_id');
            produtos.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nome} - R$ ${parseFloat(p.preco).toFixed(2)}`;
                select.appendChild(opt);
            });
        }

        function adicionarItem() {
            const produtoId = document.getElementById('produto_id').value;
            const quantidade = parseInt(document.getElementById('quantidade').value);

            if (!produtoId || !quantidade) return alert("Selecione produto e quantidade");

            fetch(`/api/produtos/${produtoId}`)
                .then(res => res.json())
                .then(produto => {
                    const subtotal = produto.preco * quantidade;
                    itensVenda.push({
                        produto_id: produto.id,
                        nome: produto.nome,
                        preco: produto.preco,
                        quantidade,
                        subtotal
                    });
                    atualizarTabela();
                });
        }

        function atualizarTabela() {
            const tbody = document.querySelector('#tabelaItens tbody');
            tbody.innerHTML = '';
            let total = 0;

            itensVenda.forEach((item, index) => {
                total += item.subtotal;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.nome}</td>
                    <td>R$ ${item.preco.toFixed(2)}</td>
                    <td>${item.quantidade}</td>
                    <td>R$ ${item.subtotal.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="removerItem(${index})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalVenda').textContent = `R$ ${total.toFixed(2)}`;
        }

        function removerItem(index) {
            itensVenda.splice(index, 1);
            atualizarTabela();
        }

        document.getElementById('formVenda').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cliente_id = document.getElementById('cliente_id').value;
            const data_venda = document.getElementById('data_venda').value;

            if (!cliente_id || itensVenda.length === 0) {
                return alert("Cliente e pelo menos um item são obrigatórios");
            }

            const venda = {
                cliente_id: parseInt(cliente_id),
                data_venda,
                itens: itensVenda
            };

            const res = await fetch('/api/vendas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(venda)
            });

            if (res.ok) {
                alert("✅ Venda registrada com sucesso!");
                itensVenda = [];
                atualizarTabela();
                document.getElementById('formVenda').reset();
            } else {
                alert("Erro ao registrar venda");
            }
        });

        // Inicializar
        window.onload = () => {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data_venda').value = hoje;
            carregarClientes();
            carregarProdutos();
        };
    </script>
</body>
</html>
