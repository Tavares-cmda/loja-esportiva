<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas - SPORT+ PRO 2.0</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:#111827;
    padding:20px;
}

.logo{
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px;
    margin-bottom:8px;
    border-radius:10px;
}

.menu a:hover{
    background:#2563eb;
}

.main{
    margin-left:250px;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

select,input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.adicionar{
    background:#2563eb;
    color:white;
}

.finalizar{
    background:#16a34a;
    color:white;
}

.remover{
    background:#dc2626;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

th{
    background:#2563eb;
    color:white;
}

.total{
    font-size:28px;
    font-weight:bold;
    color:#16a34a;
    margin-top:15px;
}

</style>
</head>
<body>

<div class="sidebar">

    <div class="logo">SPORT+</div>

    <div class="menu">
        <a href="index.html">🏠 Home</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="produtos.html">📦 Produtos</a>
        <a href="vendas.html">🛒 Vendas</a>
        <a href="consultas.html">📊 Consultas</a>
    </div>

</div>

<div class="main">

<h1>Nova Venda</h1>

<div class="card">

<select id="cliente"></select>

<select id="produto"></select>

<input
type="number"
id="quantidade"
placeholder="Quantidade"
value="1"
min="1">

<button
class="adicionar"
onclick="adicionarCarrinho()">
Adicionar ao Carrinho
</button>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Produto</th>
<th>Preço</th>
<th>Qtd</th>
<th>Subtotal</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="carrinho"></tbody>

</table>

<div
class="total"
id="total">
R$ 0,00
</div>

<br>

<button
class="finalizar"
onclick="finalizarVenda()">
Finalizar Venda
</button>

</div>

</div>

<script>

let produtos = [];
let carrinho = [];

fetch("/session")
.then(r=>r.json())
.then(user=>{
    if(!user){
        location.href="login.html";
    }
});

async function carregarClientes(){

    const resposta =
        await fetch("/clientes");

    const clientes =
        await resposta.json();

    let html = "";

    clientes.forEach(cliente=>{

        html += `
        <option value="${cliente.id}">
            ${cliente.nome}
        </option>
        `;

    });

    document.getElementById(
        "cliente"
    ).innerHTML = html;

}

async function carregarProdutos(){

    const resposta =
        await fetch("/produtos");

    produtos =
        await resposta.json();

    let html = "";

    produtos.forEach(produto=>{

        html += `
        <option value="${produto.id}">
            ${produto.nome}
            - R$ ${produto.preco}
        </option>
        `;

    });

    document.getElementById(
        "produto"
    ).innerHTML = html;

}

function adicionarCarrinho(){

    const produtoId =
        Number(
            document.getElementById("produto").value
        );

    const quantidade =
        Number(
            document.getElementById("quantidade").value
        );

    const produto =
        produtos.find(
            p=>p.id===produtoId
        );

    if(!produto) return;

    carrinho.push({

        produto_id:
        produto.id,

        nome:
        produto.nome,

        preco:
        Number(produto.preco),

        quantidade:
        quantidade

    });

    atualizarCarrinho();

}

function atualizarCarrinho(){

    let html = "";
    let total = 0;

    carrinho.forEach((item,index)=>{

        const subtotal =
            item.preco *
            item.quantidade;

        total += subtotal;

        html += `
        <tr>

        <td>${item.nome}</td>

        <td>
        R$ ${item.preco.toFixed(2)}
        </td>

        <td>
        ${item.quantidade}
        </td>

        <td>
        R$ ${subtotal.toFixed(2)}
        </td>

        <td>

        <button
        class="remover"
        onclick="removerItem(${index})">
        Remover
        </button>

        </td>

        </tr>
        `;

    });

    document.getElementById(
        "carrinho"
    ).innerHTML = html;

    document.getElementById(
        "total"
    ).innerHTML =
    "R$ " +
    total.toFixed(2);

}

function removerItem(index){

    carrinho.splice(index,1);

    atualizarCarrinho();

}

async function finalizarVenda(){

    if(carrinho.length===0){

        alert(
            "Carrinho vazio"
        );

        return;

    }

    const venda = {

        cliente_id:
        document.getElementById(
            "cliente"
        ).value,

        itens:
        carrinho

    };

    const resposta =
        await fetch(
            "/vendas",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(venda)
            }
        );

    const dados =
        await resposta.json();

    if(dados.success){

        alert(
            "Venda realizada com sucesso!"
        );

        carrinho = [];

        atualizarCarrinho();

    }

}

carregarClientes();
carregarProdutos();

</script>

</body>
</html>
