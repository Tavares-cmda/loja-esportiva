<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORT+ | Vendas</title>
<link rel="stylesheet" href="estilo.css">
</head>

<body>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="clientes.html">👥 Clientes</a>
    <a href="produtos.html">📦 Produtos</a>
    <a href="vendas.html">🛒 Vendas</a>
    <a href="consulta_vendas.html">📊 Consultas</a>
</nav>

<header class="banner">
    <h1>🛒 Nova Venda</h1>
    <p>Realize vendas e controle o estoque automaticamente</p>
</header>

<div class="container">

    <div class="card">

        <h2>Cliente</h2>

        <select id="cliente">
            <option value="">Selecione um cliente</option>
        </select>

    </div>

    <div class="card">

        <h2>Adicionar Produto</h2>

        <select id="produto">
            <option value="">Selecione um produto</option>
        </select>

        <br><br>

        <input
            type="number"
            id="quantidade"
            min="1"
            value="1"
            placeholder="Quantidade"
        >

        <br><br>

        <button onclick="adicionarCarrinho()">
            ➕ Adicionar ao Carrinho
        </button>

    </div>

    <div class="card">

        <h2>🛒 Carrinho</h2>

        <table>

            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Preço</th>
                    <th>Subtotal</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="carrinho">

            </tbody>

        </table>

    </div>

    <div class="card">

        <h2>💰 Resumo</h2>

        <p>
            Total da Venda:
            <strong id="total">
                R$ 0,00
            </strong>
        </p>

        <br>

        <button onclick="finalizarVenda()">
            ✅ Finalizar Venda
        </button>

    </div>

</div>

<footer class="rodape">
    <p>© 2026 SPORT+ - Loja Esportiva</p>
</footer>

<script>

let produtos = [];
let carrinho = [];

const selectCliente =
document.getElementById('cliente');

const selectProduto =
document.getElementById('produto');

const tabelaCarrinho =
document.getElementById('carrinho');

const totalElemento =
document.getElementById('total');

/* CLIENTES */

fetch('/listar-clientes')
.then(res => res.json())
.then(clientes => {

    clientes.forEach(cliente => {

        selectCliente.innerHTML += `
            <option value="${cliente.id}">
                ${cliente.nome}
            </option>
        `;

    });

});

/* PRODUTOS */

fetch('/listar-produtos')
.then(res => res.json())
.then(lista => {

    produtos = lista;

    lista.forEach(produto => {

        selectProduto.innerHTML += `
            <option value="${produto.id}">
                ${produto.nome}
                (Estoque: ${produto.estoque})
            </option>
        `;

    });

});

function adicionarCarrinho(){

    const id =
    parseInt(selectProduto.value);

    const qtd =
    parseInt(
        document.getElementById(
            'quantidade'
        ).value
    );

    if(!id){

        alert(
            'Selecione um produto.'
        );

        return;
    }

    const produto =
    produtos.find(
        p => p.id === id
    );

    if(!produto){

        return;
    }

    carrinho.push({

        id: produto.id,
        nome: produto.nome,
        preco: produto.preco,
        qtd: qtd

    });

    atualizarCarrinho();

}

function removerItem(index){

    carrinho.splice(index,1);

    atualizarCarrinho();

}

function atualizarCarrinho(){

    tabelaCarrinho.innerHTML = '';

    let total = 0;

    carrinho.forEach(
    (item,index) => {

        const subtotal =
        item.preco * item.qtd;

        total += subtotal;

        tabelaCarrinho.innerHTML += `
        <tr>

            <td>
                ${item.nome}
            </td>

            <td>
                ${item.qtd}
            </td>

            <td>
                R$ ${Number(item.preco)
                .toFixed(2)}
            </td>

            <td>
                R$ ${subtotal.toFixed(2)}
            </td>

            <td>

                <button
                onclick="removerItem(${index})">

                ❌

                </button>

            </td>

        </tr>
        `;

    });

    totalElemento.innerHTML =
    `R$ ${total.toFixed(2)}`;

}

function finalizarVenda(){

    if(
        selectCliente.value === ''
    ){

        alert(
            'Selecione um cliente.'
        );

        return;
    }

    if(
        carrinho.length === 0
    ){

        alert(
            'Carrinho vazio.'
        );

        return;
    }

    let total = 0;

    carrinho.forEach(item => {

        total +=
        item.preco * item.qtd;

    });

    fetch(
        '/finalizar-venda',
        {

            method:'POST',

            headers:{
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                cliente_id:
                selectCliente.value,

                total: total,

                itens: carrinho

            })

        }
    )

    .then(res => res.json())

    .then(resultado => {

        if(resultado.success){

            alert(
                'Venda realizada com sucesso!'
            );

            carrinho = [];

            atualizarCarrinho();

            location.reload();

        }else{

            alert(
                'Erro ao salvar venda.'
            );

        }

    })

    .catch(() => {

        alert(
            'Erro ao finalizar venda.'
        );

    });

}

</script>

</body>
</html>
