<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SportMax - Clientes</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="clientes.html">Clientes</a>
    <a href="produtos.html">Produtos</a>
    <a href="vendas.html">Vendas</a>
    <a href="consulta_vendas.html">Consultar Vendas</a>
</nav>

<header class="banner">
    <h1>Cadastro de Clientes</h1>
    <p>Gerencie seus clientes</p>
</header>

<div class="container">

    <div class="card">
        <h2>Novo Cliente</h2>

        <form action="/salvar-cliente" method="POST">

            <label>Nome</label>
            <input type="text" name="nome" required>

            <label>CPF</label>
            <input type="text" name="cpf" required>

            <label>Telefone</label>
            <input type="text" name="telefone" required>

            <button type="submit">
                Salvar Cliente
            </button>

        </form>
    </div>

    <div class="card">

        <h2>Clientes Cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                </tr>
            </thead>

            <tbody id="lista-clientes">
            </tbody>

        </table>

    </div>

</div>

<script>

fetch('/listar-clientes')
.then(res => res.json())
.then(clientes => {

    const tabela =
    document.getElementById('lista-clientes');

    clientes.forEach(cliente => {

        tabela.innerHTML += `
        <tr>
            <td>${cliente.nome}</td>
            <td>${cliente.cpf}</td>
            <td>${cliente.telefone}</td>
        </tr>
        `;
    });

});

</script>

<footer class="rodape">
    <p>© 2026 SportMax</p>
</footer>

</body>
</html>
