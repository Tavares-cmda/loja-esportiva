<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Sistema de Vendas</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="clientes.html">Clientes</a>
                <a class="nav-link" href="produtos.html">Produtos</a>
                <a class="nav-link" href="vendas.html">Nova Venda</a>
                <a class="nav-link" href="consulta_vendas.html">Consultar Vendas</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4><i class="bi bi-people"></i> Cadastro de Clientes</h4>
            </div>
            <div class="card-body">
                <form id="formCliente">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpf" maxlength="14">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-4">
                        <i class="bi bi-save"></i> Salvar Cliente
                    </button>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header bg-primary text-white">
                <h5>Clientes Cadastrados</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover" id="tabelaClientes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function carregarClientes() {
            const res = await fetch('/api/clientes');
            const clientes = await res.json();
            const tbody = document.querySelector('#tabelaClientes tbody');
            tbody.innerHTML = '';

            clientes.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.id}</td>
                    <td>${c.nome}</td>
                    <td>${c.cpf || '-'}</td>
                    <td>${c.email || '-'}</td>
                    <td>${c.telefone || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deletarCliente(${c.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('formCliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cliente = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value
            };

            const res = await fetch('/api/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cliente)
            });

            if (res.ok) {
                alert("✅ Cliente cadastrado com sucesso!");
                document.getElementById('formCliente').reset();
                carregarClientes();
            } else {
                alert("Erro ao cadastrar cliente");
            }
        });

        async function deletarCliente(id) {
            if (confirm("Tem certeza que deseja excluir este cliente?")) {
                await fetch(`/api/clientes/${id}`, { method: 'DELETE' });
                carregarClientes();
            }
        }

        window.onload = carregarClientes;
    </script>
</body>
</html>
