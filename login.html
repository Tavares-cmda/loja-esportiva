<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORT+ PRO 2.0 - Login</title>
    
    <link rel="stylesheet" href="estilo.css">
    
    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .login-box{
            background:#fff;
            width:380px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.3);
            text-align:center;
        }
        .logo{
            font-size:35px;
            font-weight:bold;
            color:#2563eb;
            margin-bottom:10px;
        }
        .subtitulo{
            color:#666;
            margin-bottom:25px;
        }
        .input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:10px;
            box-sizing:border-box;
            font-size:16px;
        }
        .input:focus{
            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,0.1);
        }
        .botao{
            width:100%;
            border:none;
            background:#2563eb;
            color:white;
            padding:14px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }
        .botao:hover{
            background:#1d4ed8;
        }
        .botao:disabled{
            background:#94a3b8;
            cursor:not-allowed;
        }
        .erro{
            margin-top:15px;
            color:#dc2626;
            font-size:14px;
            min-height:20px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">SPORT+</div>
    <div class="subtitulo">Sistema de Gestão Esportiva</div>
    
    <input
        type="text"
        id="usuario"
        class="input"
        placeholder="Usuário"
        autocomplete="username">
    
    <input
        type="password"
        id="senha"
        class="input"
        placeholder="Senha"
        autocomplete="current-password">
    
    <button
        id="btnLogin"
        class="botao"
        onclick="fazerLogin()">
        Entrar
    </button>
    
    <div id="erro" class="erro"></div>
</div>

<script>
async function fazerLogin() {
    const btn = document.getElementById("btnLogin");
    const erroDiv = document.getElementById("erro");
    
    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();

    // Validação
    if (!usuario || !senha) {
        erroDiv.innerHTML = "Preencha usuário e senha!";
        return;
    }

    // Desabilitar botão durante o login
    btn.disabled = true;
    btn.textContent = "Entrando...";
    erroDiv.innerHTML = "";

    try {
        const resposta = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ usuario, senha })
        });

        const dados = await resposta.json();

        if (dados.success) {
            window.location.href = "index.html";
        } else {
            erroDiv.innerHTML = dados.message || "Usuário ou senha incorretos!";
            document.getElementById("senha").value = ""; // Limpa senha
            document.getElementById("senha").focus();
        }
    } catch (error) {
        console.error(error);
        erroDiv.innerHTML = "Erro de conexão com o servidor. Tente novamente.";
    } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
    }
}

// Permitir login pressionando ENTER
document.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        fazerLogin();
    }
});

// Foco automático no campo de usuário
document.getElementById("usuario").focus();
</script>

</body>
</html>
