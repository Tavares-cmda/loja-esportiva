<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORT+ PRO 2.0 - Login</title>

<link rel="stylesheet" href="estilo.css">

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#fff;
    width:380px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    text-align:center;
}

.logo{
    font-size:35px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:10px;
}

.subtitulo{
    color:#666;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

.botao{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.botao:hover{
    background:#1d4ed8;
}

.erro{
    margin-top:15px;
    color:red;
    font-size:14px;
}
</style>

</head>
<body>

<div class="login-box">

    <div class="logo">
        SPORT+
    </div>

    <div class="subtitulo">
        Sistema de Gestão Esportiva
    </div>

    <input
        type="text"
        id="usuario"
        class="input"
        placeholder="Usuário">

    <input
        type="password"
        id="senha"
        class="input"
        placeholder="Senha">

    <button
        class="botao"
        onclick="fazerLogin()">
        Entrar
    </button>

    <div id="erro" class="erro"></div>

</div>

<script>

async function fazerLogin(){

    const usuario =
        document.getElementById("usuario").value;

    const senha =
        document.getElementById("senha").value;

    const resposta =
        await fetch("/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                usuario,
                senha
            })
        });

    const dados =
        await resposta.json();

    if(dados.success){

        window.location =
            "index.html";

    }else{

        document.getElementById("erro")
        .innerHTML =
        dados.message;

    }

}

</script>

</body>
</html>
